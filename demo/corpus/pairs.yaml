# Harbourbrook Student Homes (made up): past customer emails and the replies the team sent.
# Invented for the demo. See README.md in this folder.
pairs:
# ---- Deposit: when is it paid back --------------------------------------------------
- {thread_id: t001, customer_id: s001, asked_at: "2026-02-03T09:12:00+01:00", question: "hi, i moved out on 31 jan, when do i get my deposit back?", answer: "Hi Lukas, thanks for your message. After move-out our caretaker inspects the room within 5 working days, and your deposit is paid back to the bank account you gave us within 30 days of your move-out date, minus any deductions. If there are deductions you'll get an itemised statement by email. Kind regards, the Harbourbrook team"}
- {thread_id: t002, customer_id: s002, asked_at: "2026-02-10T14:40:00+01:00", question: "Hello, It has been 2 weeks since I left my room and I still didn't receive my deposit. Is there a problem?", answer: "Hi Mei, no problem as far as we can see. Deposits are paid back within 30 days of the move-out date, after the inspection of the room. If anything is deducted you'll receive an itemised statement by email first. Kind regards, the Harbourbrook team"}
- {thread_id: t003, customer_id: s003, asked_at: "2026-03-02T08:05:00+01:00", question: "When will the deposit be returned? I need the money for my new place", answer: "Hi Tomás, we understand. The deposit is paid back within 30 days of your move-out date, after our caretaker has inspected the room. We're not able to speed this up from the support desk, as refunds are handled by our finance team. Kind regards, the Harbourbrook team"}
- {thread_id: t004, customer_id: s004, asked_at: "2026-03-15T19:22:00+01:00", question: "deposit??? moved out 3 weeks ago", answer: "Hi Anna, deposits are paid back within 30 days of the move-out date, after the room inspection. If there are deductions you'll get an itemised statement by email before the payment. Kind regards, the Harbourbrook team"}
- {thread_id: t005, customer_id: s005, asked_at: "2026-04-01T11:30:00+02:00", question: "Wanneer krijg ik mijn borg terug? Ik ben 20 maart verhuisd.", answer: "Hoi Daan, na je vertrek controleert onze beheerder de kamer binnen 5 werkdagen. De borg wordt binnen 30 dagen na je vertrekdatum teruggestort op het rekeningnummer dat je ons hebt gegeven, min eventuele inhoudingen. Groet, het Harbourbrook-team"}
- {thread_id: t006, customer_id: s006, asked_at: "2026-05-04T10:02:00+02:00", question: "Can I get my deposit back to a different bank account? I closed my dutch account", answer: "Hi Sofia, yes. Please send us the IBAN and the name of the account holder by replying to this email, and we'll pass it to our finance team before the deposit is paid. Kind regards, the Harbourbrook team"}
- {thread_id: t007, customer_id: s007, asked_at: "2026-06-30T16:45:00+02:00", question: "hey quick q, how long does the deposit take after moving out", answer: "Hi Jonas, the deposit is paid back within 30 days of your move-out date, after the caretaker's inspection. Kind regards, the Harbourbrook team"}
- {thread_id: t008, customer_id: s008, asked_at: "2026-08-03T09:50:00+02:00", question: "Wann bekomme ich meine Kaution zurück? Ich bin am 31. Juli ausgezogen.", answer: "Hallo Lena, nach dem Auszug prüft unser Hausmeister das Zimmer innerhalb von 5 Werktagen. Die Kaution wird innerhalb von 30 Tagen nach dem Auszugsdatum auf das angegebene Konto überwiesen, abzüglich eventueller Abzüge. Viele Grüße, das Harbourbrook-Team"}
# ---- Deposit: deductions disputed ---------------------------------------------------
- {thread_id: t009, customer_id: s009, asked_at: "2026-02-20T13:10:00+01:00", question: "You deducted 85 euros for cleaning but I cleaned the room before leaving!! This is not fair", answer: "Hi Ahmed, sorry to hear you disagree with the deduction. You can dispute it by replying to the deduction statement within 14 days, with photos of the room if you have them. Disputes are reviewed by our finance team, who will get back to you with their decision. Kind regards, the Harbourbrook team"}
- {thread_id: t010, customer_id: s010, asked_at: "2026-03-28T10:15:00+01:00", question: "why was 60 euro taken from my deposit for wall damage, there were holes already when i moved in", answer: "Hi Chloe, thanks for letting us know. If the damage was there when you moved in, please reply to your deduction statement within 14 days with any photos or the move-in report you sent us. Our finance team reviews every dispute. Kind regards, the Harbourbrook team"}
- {thread_id: t011, customer_id: s011, asked_at: "2026-07-12T20:30:00+02:00", question: "I want to complain about the deductions from my deposit, 45 for a key card?? I returned it", answer: "Hi Ravi, sorry about the confusion. Please reply to the deduction statement within 14 days and tell us when and where you returned the key card. Our finance team checks the key log and reviews the deduction. Kind regards, the Harbourbrook team"}
- {thread_id: t012, customer_id: s012, asked_at: "2026-08-19T09:05:00+02:00", question: "Can you please refund the cleaning fee, my room was clean, I have pictures", answer: "Hi Julia, thanks, photos help a lot. Please reply to your deduction statement with the pictures within 14 days of receiving it. Our finance team reviews disputes and will let you know their decision by email. Kind regards, the Harbourbrook team"}
# ---- Key pick-up and arrival ------------------------------------------------------
- {thread_id: t013, customer_id: s013, asked_at: "2026-01-20T12:00:00+01:00", question: "Hello, when and where can I pick up my keys? I arrive on 1 february", answer: "Hi Kenji, welcome! Keys are collected at our office, Kadeweg 12, Monday to Friday between 10:00 and 16:00. Please make sure your signed contract, first month's rent and deposit have been received before you come. Kind regards, the Harbourbrook team"}
- {thread_id: t014, customer_id: s014, asked_at: "2026-01-25T22:14:00+01:00", question: "my flight lands at 9pm on saturday, how do I get into my room??", answer: "Hi Fatima, no problem. Because you arrive outside office hours, we'll send you a code for the key box at the building entrance 24 hours before you arrive. Please confirm your arrival date by replying to this email. Kind regards, the Harbourbrook team"}
- {thread_id: t015, customer_id: s015, asked_at: "2026-02-01T07:30:00+01:00", question: "I'm arriving on Sunday evening, is someone there to give me the key?", answer: "Hi Oliver, the office is closed at weekends, but you can use our key box. Let us know your arrival date and we'll send you the key box code 24 hours before you arrive. Kind regards, the Harbourbrook team"}
- {thread_id: t016, customer_id: s016, asked_at: "2026-02-14T15:20:00+01:00", question: "what documents do i need to bring to get my keys", answer: "Hi Priya, you only need your ID. Before we can hand over the keys we need your signed contract, first month's rent and deposit, all received on our side. Kind regards, the Harbourbrook team"}
- {thread_id: t017, customer_id: s017, asked_at: "2026-08-24T18:40:00+02:00", question: "Hi my train is delayed and I will only arrive in Westmere at 17:30 today, office closes at 16. what can I do", answer: "Hi Marco, sorry about the delay. If you requested a key box code in advance we can still send it today. If not, unfortunately we can't arrange the key box on the same day, and you can collect your keys tomorrow from 10:00. Kind regards, the Harbourbrook team"}
- {thread_id: t018, customer_id: s018, asked_at: "2026-08-26T09:10:00+02:00", question: "hello can i come get the keys on saturday morning", answer: "Hi Aisha, the office is closed on Saturdays, but we can send you a key box code instead. Please confirm the day you arrive and we'll send the code 24 hours before. Kind regards, the Harbourbrook team"}
- {thread_id: t019, customer_id: s019, asked_at: "2026-08-28T11:25:00+02:00", question: "Ik kom zondag aan, hoe krijg ik mijn sleutel?", answer: "Hoi Sanne, op zondag is het kantoor dicht, maar je kunt de sleutelkluis bij de ingang gebruiken. Laat ons je aankomstdatum weten, dan sturen we je de code 24 uur van tevoren. Groet, het Harbourbrook-team"}
- {thread_id: t020, customer_id: s020, asked_at: "2026-08-30T21:05:00+02:00", question: "I arrive on 1 September at 23:00 because of my flight, will I be able to get in?", answer: "Hi Wei, yes. We'll send you a key box code 24 hours before you arrive, so you can let yourself in. Please confirm your arrival date by replying to this email. Kind regards, the Harbourbrook team"}
# ---- Heating and hot water --------------------------------------------------------
- {thread_id: t021, customer_id: s021, asked_at: "2026-02-05T08:20:00+01:00", question: "The heating in my room doesnt work since yesterday and its freezing", answer: "Hi Elif, sorry, that's no fun in February. No heating in winter is an urgent repair, so please report it in the tenant portal with a photo of the thermostat and we'll send someone today. Outside office hours, call the emergency line on +31 20 555 0199. Kind regards, the Harbourbrook team"}
- {thread_id: t022, customer_id: s022, asked_at: "2026-02-18T19:45:00+01:00", question: "no hot water in the shower on the 3rd floor", answer: "Hi Noah, thanks for reporting. No hot water is urgent: please log it in the tenant portal so the caretaker is dispatched today. If it's after office hours, call the emergency line on +31 20 555 0199. Kind regards, the Harbourbrook team"}
- {thread_id: t023, customer_id: s023, asked_at: "2026-03-03T07:55:00+01:00", question: "radiator is cold, i tried turning it up but nothing happens", answer: "Hi Isabel, thanks for trying. A cold radiator in winter counts as an urgent repair. Please report it in the tenant portal with a photo and the caretaker will come today. Kind regards, the Harbourbrook team"}
- {thread_id: t024, customer_id: s024, asked_at: "2026-11-02T08:00:00+01:00", question: "Mijn verwarming doet het niet meer, kunnen jullie iemand sturen?", answer: "Hoi Bram, geen verwarming in de winter is een spoedreparatie. Meld het in het bewonersportaal met een foto, dan komt de beheerder vandaag nog. Buiten kantooruren kun je het noodnummer bellen: +31 20 555 0199. Groet, het Harbourbrook-team"}
# ---- Leaks and urgent repairs -----------------------------------------------------
- {thread_id: t025, customer_id: s025, asked_at: "2026-03-09T23:10:00+01:00", question: "there is water coming through the ceiling in my bathroom!!!", answer: "Hi Sara, please call our emergency line straight away on +31 20 555 0199, it's staffed day and night. If you can, put a bucket underneath and keep electrical items away from the water. Kind regards, the Harbourbrook team"}
- {thread_id: t026, customer_id: s026, asked_at: "2026-04-12T02:30:00+02:00", question: "My door lock is broken and I can't lock my room", answer: "Hi Leon, a lock that doesn't work is an urgent repair. Please call the emergency line on +31 20 555 0199 now, and also log it in the tenant portal. Kind regards, the Harbourbrook team"}
- {thread_id: t027, customer_id: s027, asked_at: "2026-05-20T17:40:00+02:00", question: "power went out in my room only, the rest of the corridor has electricity", answer: "Hi Hana, please first check the fuse box in your room (behind the door) and switch the tripped switch back on. If that doesn't help, it's an urgent repair: report it in the tenant portal, or call +31 20 555 0199 after office hours. Kind regards, the Harbourbrook team"}
# ---- Non-urgent repairs and follow-ups ----------------------------------------------
- {thread_id: t028, customer_id: s028, asked_at: "2026-03-18T12:10:00+01:00", question: "the tap in my kitchen is dripping, can someone fix it?", answer: "Hi Emma, thanks for letting us know. Please report it in the tenant portal with a photo. Non-urgent repairs like this are scheduled within 5 working days, and the caretaker will email you before coming. Kind regards, the Harbourbrook team"}
- {thread_id: t029, customer_id: s029, asked_at: "2026-04-22T09:35:00+02:00", question: "my desk lamp and a shelf are broken", answer: "Hi Mateo, please log both in the tenant portal with photos. Non-urgent repairs are scheduled within 5 working days. Kind regards, the Harbourbrook team"}
- {thread_id: t030, customer_id: s030, asked_at: "2026-05-06T10:05:00+02:00", question: "I reported the broken window handle 10 days ago and nobody came", answer: "Hi Nora, sorry for the wait, that's longer than it should be. We've checked the portal and flagged your report with the caretaker. You'll get an email with the visit time. Kind regards, the Harbourbrook team"}
- {thread_id: t031, customer_id: s031, asked_at: "2026-06-11T14:50:00+02:00", question: "still waiting for someone to fix the fridge, reported last week", answer: "Hi Yusuf, sorry for the delay. We've checked your report in the portal and asked the caretaker to schedule it. You'll receive an email with the visit time. Kind regards, the Harbourbrook team"}
- {thread_id: t032, customer_id: s032, asked_at: "2026-07-01T08:30:00+02:00", question: "the washing machine number 3 is broken again", answer: "Hi Clara, thanks. Please report it in the portal with the machine number. The laundry machines are serviced by an outside company, and we'll pass it on to them. Kind regards, the Harbourbrook team"}
- {thread_id: t033, customer_id: s033, asked_at: "2026-07-15T19:00:00+02:00", question: "dryer eats my money and doesnt start", answer: "Hi Finn, sorry about that. Please report it in the portal with the dryer's number from the front of the machine; the laundry company handles repairs. Kind regards, the Harbourbrook team"}
# ---- Registration letter -----------------------------------------------------------
- {thread_id: t034, customer_id: s034, asked_at: "2026-02-04T10:20:00+01:00", question: "I need a letter to register at the town hall, how do I get it?", answer: "Hi Aarav, you can request the registration letter in the tenant portal once you've collected your keys. We send it within 3 working days. Kind regards, the Harbourbrook team"}
- {thread_id: t035, customer_id: s035, asked_at: "2026-02-09T11:45:00+01:00", question: "Hi, my appointment at the gemeente is on thursday and I still don't have the letter", answer: "Hi Zoe, the registration letter is sent within 3 working days of your request in the portal. If you requested it more than 3 working days ago, reply with your room number and we'll check where it is. Kind regards, the Harbourbrook team"}
- {thread_id: t036, customer_id: s036, asked_at: "2026-08-31T13:15:00+02:00", question: "can you send me the proof of address document for BSN registration", answer: "Hi Diego, yes: request the registration letter in the tenant portal after you've collected your keys, and we'll send it within 3 working days. Kind regards, the Harbourbrook team"}
- {thread_id: t037, customer_id: s037, asked_at: "2026-09-02T09:00:00+02:00", question: "i need a housing declaration for my residence permit, the IND asks for it", answer: "Hi Amira, the registration letter confirming your tenancy works for this too. Request it in the tenant portal and we'll send it within 3 working days. Kind regards, the Harbourbrook team"}
- {thread_id: t038, customer_id: s038, asked_at: "2026-09-03T15:30:00+02:00", question: "Waar kan ik de brief voor de gemeente aanvragen?", answer: "Hoi Lotte, je kunt de brief voor de inschrijving aanvragen in het bewonersportaal, nadat je je sleutels hebt opgehaald. We sturen hem binnen 3 werkdagen. Groet, het Harbourbrook-team"}
# ---- Ending the contract ------------------------------------------------------------
- {thread_id: t039, customer_id: s039, asked_at: "2026-03-05T16:00:00+01:00", question: "I want to end my contract, how much notice do I need to give?", answer: "Hi Hugo, the notice period is one calendar month, ending on the last day of a month. Please give notice by email. If you're still within the 5-month minimum period, you can only leave early if an approved replacement tenant takes over. Kind regards, the Harbourbrook team"}
- {thread_id: t040, customer_id: s040, asked_at: "2026-04-14T12:30:00+02:00", question: "I got an internship in another city and need to leave after 3 months, can I cancel?", answer: "Hi Sophie, congratulations on the internship! Contracts have a 5-month minimum, so leaving earlier is only possible if an approved replacement tenant takes over your contract. You're welcome to suggest someone; the office will check them. Kind regards, the Harbourbrook team"}
- {thread_id: t041, customer_id: s041, asked_at: "2026-05-28T10:40:00+02:00", question: "can i leave on 15 june instead of end of month", answer: "Hi Adam, the notice period always ends on the last day of a month, so your contract would end on 30 June. You're free to move out earlier, but rent runs until the end date. Kind regards, the Harbourbrook team"}
- {thread_id: t042, customer_id: s042, asked_at: "2026-06-02T08:25:00+02:00", question: "I found someone to take over my room, what do I do", answer: "Hi Ines, great. Please send us their name and email address, and the date they'd like to start. The office checks and approves replacement tenants, and we'll let you both know. Kind regards, the Harbourbrook team"}
- {thread_id: t043, customer_id: s043, asked_at: "2026-06-20T21:10:00+02:00", question: "Ich möchte meinen Vertrag kündigen, wie lange ist die Kündigungsfrist?", answer: "Hallo Felix, die Kündigungsfrist beträgt einen Kalendermonat zum Monatsende, per E-Mail. Innerhalb der Mindestlaufzeit von 5 Monaten ist ein früherer Auszug nur mit einem genehmigten Nachmieter möglich. Viele Grüße, das Harbourbrook-Team"}
# ---- Subletting and guests ---------------------------------------------------------
- {thread_id: t044, customer_id: s044, asked_at: "2026-03-12T17:20:00+01:00", question: "I'm going home for summer, can a friend stay in my room for 2 months?", answer: "Hi Lucas, unfortunately subletting or letting someone else live in your room isn't allowed. Guests may stay up to 3 nights in a row and 10 nights per month while you're there. Kind regards, the Harbourbrook team"}
- {thread_id: t045, customer_id: s045, asked_at: "2026-04-30T19:55:00+02:00", question: "can my boyfriend stay over for a week when he visits", answer: "Hi Maya, guests may stay a maximum of 3 nights in a row and 10 nights per month, so a full week isn't possible, sorry. Kind regards, the Harbourbrook team"}
- {thread_id: t046, customer_id: s046, asked_at: "2026-07-08T11:05:00+02:00", question: "my parents are visiting, can they sleep in my room 2 nights?", answer: "Hi Chen, yes, that's fine: guests may stay up to 3 nights in a row and 10 nights per month. Enjoy the visit! Kind regards, the Harbourbrook team"}
# ---- Rent and payments -------------------------------------------------------------
- {thread_id: t047, customer_id: s047, asked_at: "2026-02-27T10:10:00+01:00", question: "my scholarship is late this month, can I pay rent a bit later?", answer: "Hi Kofi, thanks for letting us know in advance. Only our finance team can agree a later payment or a payment plan, so we've passed your message to them and they'll contact you by email. Please note that from the 8th a late fee of EUR 15 applies unless finance agrees otherwise. Kind regards, the Harbourbrook team"}
- {thread_id: t048, customer_id: s048, asked_at: "2026-04-06T09:40:00+02:00", question: "I got a reminder for rent but I paid on the 2nd!", answer: "Hi Laura, sorry for the confusion. Payments can take a few working days to show on our side. Please reply with a screenshot of the transfer and we'll check it with finance. Kind regards, the Harbourbrook team"}
- {thread_id: t049, customer_id: s049, asked_at: "2026-05-09T13:25:00+02:00", question: "why was I charged 15 euro extra this month", answer: "Hi Samuel, that's the late fee, which is added when rent is received after the 7th of the month. If you think it was charged by mistake, reply with the date of your transfer and we'll check it with finance. Kind regards, the Harbourbrook team"}
- {thread_id: t050, customer_id: s050, asked_at: "2026-06-01T08:15:00+02:00", question: "when is rent due and what is the account number", answer: "Hi Alice, rent is due on the 1st of each month. The account number and your payment reference are on your contract and in the tenant portal under Payments. Kind regards, the Harbourbrook team"}
- {thread_id: t051, customer_id: s051, asked_at: "2026-07-03T16:30:00+02:00", question: "can I get an invoice for my rent for my university", answer: "Hi Omar, yes: you can download monthly rent invoices in the tenant portal under Payments. Kind regards, the Harbourbrook team"}
- {thread_id: t052, customer_id: s052, asked_at: "2026-08-29T12:00:00+02:00", question: "I can't pay the full rent in September, is a payment plan possible?", answer: "Hi Leila, thanks for telling us early. Payment plans can only be agreed by our finance team, so we've passed your request on and they'll contact you by email. Kind regards, the Harbourbrook team"}
# ---- Internet ----------------------------------------------------------------------
- {thread_id: t053, customer_id: s053, asked_at: "2026-02-11T21:40:00+01:00", question: "the wifi keeps disconnecting in my room", answer: "Hi Ben, sorry about that. Please restart your device first and make sure you're on HB-Residents. If it keeps dropping, try the wired port in your room, and if the whole floor is affected, report it in the tenant portal. Kind regards, the Harbourbrook team"}
- {thread_id: t054, customer_id: s054, asked_at: "2026-03-22T20:15:00+01:00", question: "what is the wifi password", answer: "Hi Grace, the network is HB-Residents. You log in with your tenant number and the password from your welcome email. Kind regards, the Harbourbrook team"}
- {thread_id: t055, customer_id: s055, asked_at: "2026-05-14T22:05:00+02:00", question: "no internet on the whole 2nd floor since an hour", answer: "Hi Arjun, thanks for reporting it. When a whole floor is down, please log it in the tenant portal so our provider is notified; we'll follow up with them. Kind regards, the Harbourbrook team"}
- {thread_id: t056, customer_id: s056, asked_at: "2026-09-05T19:30:00+02:00", question: "internet super slow in the evenings, cant even do my online class", answer: "Hi Nadia, sorry, that's frustrating. For online classes the wired port in your room is more stable than wifi. If it's slow on the wired port too, please report it in the tenant portal with the times it happens. Kind regards, the Harbourbrook team"}
# ---- Post and parcels --------------------------------------------------------------
- {thread_id: t057, customer_id: s057, asked_at: "2026-02-25T15:00:00+01:00", question: "where do i pick up a package, the delivery guy said it's at the office", answer: "Hi Tariq, parcels that don't fit in the letterbox are held at our office for 14 days. Pick it up Monday to Friday between 10:00 and 16:00, and bring your ID. Kind regards, the Harbourbrook team"}
- {thread_id: t058, customer_id: s058, asked_at: "2026-04-17T10:50:00+02:00", question: "My letter from DUO didnt arrive, where is post delivered", answer: "Hi Eva, post goes to the letterboxes in the entrance hall, labelled with your room number. Make sure the sender uses your room number in the address. Kind regards, the Harbourbrook team"}
# ---- Noise --------------------------------------------------------------------------
- {thread_id: t059, customer_id: s059, asked_at: "2026-03-01T01:20:00+01:00", question: "my neighbour plays loud music every night until 2am", answer: "Hi Simon, sorry to hear that. Quiet hours are 23:00 to 07:00. If you feel comfortable, try talking to your neighbour first. If it keeps happening, report it in the tenant portal with the dates and times, and the house manager will follow up. Kind regards, the Harbourbrook team"}
- {thread_id: t060, customer_id: s060, asked_at: "2026-06-14T23:50:00+02:00", question: "party in the kitchen on floor 4 again, it's midnight", answer: "Hi Rosa, sorry about the noise. Quiet hours start at 23:00. Please report it in the tenant portal with the date and time so the house manager can follow up with the floor. Kind regards, the Harbourbrook team"}
# ---- Room changes and extensions --------------------------------------------------
- {thread_id: t061, customer_id: s061, asked_at: "2026-04-03T14:35:00+02:00", question: "Can I move to a bigger room in the same building?", answer: "Hi Victor, room changes are possible once per contract for an admin fee of EUR 50, if a room is free. Tell us what you're looking for and we'll check availability. Kind regards, the Harbourbrook team"}
- {thread_id: t062, customer_id: s062, asked_at: "2026-06-25T11:20:00+02:00", question: "I want to stay another semester, can I extend my contract?", answer: "Hi Helena, great to hear you'd like to stay. Extensions are offered 2 months before your end date, subject to availability; you'll receive an email then. Kind regards, the Harbourbrook team"}
- {thread_id: t063, customer_id: s063, asked_at: "2026-07-20T09:15:00+02:00", question: "my contract ends in october, will I get an extension offer?", answer: "Hi Karim, extension offers go out 2 months before the end date, subject to availability, so you should hear from us in August. Kind regards, the Harbourbrook team"}
# ---- Bikes and cleaning -------------------------------------------------------------
- {thread_id: t064, customer_id: s064, asked_at: "2026-02-16T08:45:00+01:00", question: "where can i put my bike", answer: "Hi Ella, please use the bike cellar, entrance at the back of the building. Bikes in the hallways or in front of the entrance are removed after a warning label. Kind regards, the Harbourbrook team"}
- {thread_id: t065, customer_id: s065, asked_at: "2026-05-02T17:05:00+02:00", question: "my bike was removed from the front of the building!! where is it", answer: "Hi Max, sorry for the trouble. Bikes left in front of the entrance are removed after a warning label. Reply with a description of your bike and we'll check whether it's in our storage. Kind regards, the Harbourbrook team"}
- {thread_id: t066, customer_id: s066, asked_at: "2026-03-26T19:40:00+01:00", question: "the kitchen on our floor is disgusting, nobody cleans", answer: "Hi Iris, sorry to hear that. Kitchens are cleaned by the tenants on each floor on a rota. Please report it in the tenant portal and the house manager will remind your floor of the rota. Kind regards, the Harbourbrook team"}
# ---- Damage at move-in --------------------------------------------------------------
- {thread_id: t067, customer_id: s067, asked_at: "2026-02-02T18:10:00+01:00", question: "There's a stain on the carpet and a scratch on the desk in my new room, I don't want to pay for this later", answer: "Hi Paula, thanks for checking. Please report it in the tenant portal with photos within 7 days of moving in, and it won't be charged to you when you leave. Kind regards, the Harbourbrook team"}
- {thread_id: t068, customer_id: s068, asked_at: "2026-09-04T20:20:00+02:00", question: "moved in yesterday, the mattress is broken and one chair is missing", answer: "Hi Ali, sorry about that. Please report both in the tenant portal with photos; since it's within 7 days of moving in it won't be charged to you. The caretaker will be in touch about the mattress. Kind regards, the Harbourbrook team"}
