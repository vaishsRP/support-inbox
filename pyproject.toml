[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-inbox"
version = "0.1.0"
description = "Drafts support replies from past approved answers, refuses when it has nothing, and tracks what you promised."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "rapidfuzz>=3.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "tzdata>=2024.1",   # time zones on Windows, which has no system database
]

[project.optional-dependencies]
# The real embedding model. Left out of CI, where tests use a hashing stand-in.
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inbox = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
