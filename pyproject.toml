[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-inbox"
version = "0.1.0"
description = "Drafts support replies from past approved answers, refuses when it has nothing, and tracks what you promised."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "rapidfuzz>=3.6",
    "dateparser>=1.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
