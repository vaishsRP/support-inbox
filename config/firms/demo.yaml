# The demo's made-up company. Everything about it is invented; see demo/corpus/README.md.

firm:
  name: Harbourbrook Student Homes (made-up demo company)
  timezone: Europe/Amsterdam

corpus:
  kind: helpdesk
  path: demo/corpus/pairs.yaml
  brand_handle: harbourbrook

public_numbers:
  - "+31 20 555 0100"
  - "+31 20 555 0199"

docs_dir: demo/corpus/docs

# House rules in plain language. Every draft follows them; edit freely.
guidance:
  - In Dutch, address students with "je", never "u".
  - Never give a date for a deposit refund beyond what the policy says; refunds are decided by finance.
  - Never mention another tenant by name or room number.
  - Keep replies under 120 words.

# How replies are framed. The drafter writes only the body; greeting and sign-off come
# from here, in the customer's language, with the name from how they signed off.
email_style:
  en:
    greeting_named: "Hi {name},"
    greeting: "Hi,"
    signoff: |-
      Kind regards,
      The Harbourbrook team
  nl:
    greeting_named: "Hoi {name},"
    greeting: "Hoi,"
    signoff: |-
      Groet,
      Het Harbourbrook-team
  de:
    greeting_named: "Hallo {name},"
    greeting: "Hallo,"
    signoff: |-
      Viele Grüße,
      Das Harbourbrook-Team

data_dir: data/demo

# Gmail (optional). The address is whichever account signs in with gmail-auth.
gmail:
  digest_to: ""          # who gets the morning digest as a draft; empty = no digest

# Provisional until labelled, like every firm starts. The demo corpus is small and
# written in one voice, so its similarities sit higher than the Twitter corpus.
thresholds:
  reuse: 0.9
  docs: 0.84
  high: 0.94
  medium: 0.92
  provisional: true
